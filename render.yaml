services:
  - type: web
    name: ecowaste-portal
    env: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: "EcoWaste Portal"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: ecowaste-portal
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ecowaste-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ecowaste-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ecowaste-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ecowaste-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ecowaste-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

databases:
  - name: ecowaste-db
    plan: free
    databaseName: ecowaste
    user: ecowaste
