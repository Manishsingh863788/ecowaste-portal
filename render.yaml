services:
  - type: web
    name: ecowaste-portal
    env: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: "EcoWaste Portal"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: "base64:mXhhQMFRQaGoRBnD3oUkMPLvw8yfU9aJuNzX8pmH5vk="
      - key: APP_URL
        fromService:
          type: web
          name: ecowaste-portal
          property: host
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
